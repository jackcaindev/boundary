[project]
name = "boundary-sample-agent"
version = "0.1.0"
description = "Boundary's separate Phase 1 sample system under test"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.4",
    "httpx==0.28.1",
    "langgraph==1.2.9",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "uvicorn==0.38.0",
]

[build-system]
requires = ["uv_build==0.9.30"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sample_agent"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]
