services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      boundary:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --timeout=2
        - --spider
        - http://127.0.0.1:5173/healthz
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge
      - app

  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: boundary
      POSTGRES_USER: boundary
      POSTGRES_PASSWORD: boundary-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boundary -d boundary"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - boundary-postgres:/var/lib/postgresql/data
    networks:
      - data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /app/backend/.venv/bin/alembic
      - -c
      - /app/migrations/alembic.ini
      - upgrade
      - head
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://boundary:boundary-local-only@postgres:5432/boundary
      SUT_BASE_URL: http://sample-agent:8001
      BOUNDARY_INTERNAL_BASE_URL: http://boundary:8000
      RUN_DEADLINE_MS: "30000"
      CANCELLATION_GRACE_MS: "2000"
      TARGET_POLL_INTERVAL_MS: "100"
      TOOL_CLIENT_TIMEOUT_MS: "500"
      INJECTED_HOLD_MS: "1000"
      MAX_EVENT_BYTES: "65536"
      MAX_TARGET_EVENTS: "256"
      MAX_TARGET_EVENT_BYTES: "1048576"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  boundary:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /app/backend/.venv/bin/uvicorn
      - boundary.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://boundary:boundary-local-only@postgres:5432/boundary
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - data
      - app

  sample-agent:
    build:
      context: .
      dockerfile: sample-agent/Dockerfile
    environment:
      MODEL_MODE: fake
      OPENAI_MODEL: gpt-5.6-luna
      MODEL_REQUEST_TIMEOUT_MS: "10000"
      SAMPLE_AGENT_START_DELAY_MS: "500"
    healthcheck:
      test:
        - CMD
        - /app/sample-agent/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      boundary:
        condition: service_healthy
    networks:
      - app

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /app/backend/.venv/bin/pytest
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://boundary:boundary-local-only@postgres:5432/boundary
      SUT_BASE_URL: http://sample-agent:8001
      BOUNDARY_INTERNAL_BASE_URL: http://boundary:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      sample-agent:
        condition: service_healthy
      boundary:
        condition: service_healthy
    networks:
      - data
      - app

  sample-agent-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: sample-agent/Dockerfile
    command:
      - /app/sample-agent/.venv/bin/pytest
    networks:
      - app

volumes:
  boundary-postgres:

networks:
  edge:
  data:
    internal: true
  app:
    internal: true
